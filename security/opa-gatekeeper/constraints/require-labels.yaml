# security/opa-gatekeeper/constraints/require-labels.yaml — Constraint (where the policy applies).
# The Rego policy itself is the ConstraintTemplate in ../templates/require-labels.yaml.

# Step 2: Instantiate the constraint (apply the policy)
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: require-app-labels
  labels:
    team: platform
    app.kubernetes.io/component: opa-policy
spec:
  # Apply to Deployments and Services in our app namespaces
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
      - apiGroups: [""]
        kinds: ["Service"]
    namespaces:
      - gitops-dev
      - gitops-staging
      - gitops-prod
  parameters:
    labels:
      - "app"
      - "team"
