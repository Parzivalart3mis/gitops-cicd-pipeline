# frontend/deployment.yaml — Kubernetes Deployment for the Nginx frontend.
#
# The container's Nginx serves the static UI and reverse-proxies /backend/*
# to the backend Service (BACKEND_UPSTREAM), so the browser only ever talks
# to the frontend's own origin. The NetworkPolicy "frontend-allow-ingress"
# permits exactly that egress (frontend → backend:8000).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 1  # initial value — overlays set it; the HPA owns it afterwards
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user in alpine image
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Best-effort spread across nodes; see backend/deployment.yaml for why
      # ScheduleAnyway + nodeTaintsPolicy: Honor + pod-template-hash.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: frontend
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: frontend
          # Placeholder — the overlay's images[] entry sets the real tag.
          image: ghcr.io/parzivalart3mis/gitops-frontend:latest
          imagePullPolicy: IfNotPresent  # immutable SHA tags; see backend
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: backend_url
            - name: BACKEND_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: backend_upstream
            - name: FRONTEND_VERSION
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: frontend_version
          securityContext:
            allowPrivilegeEscalation: false
            # The entrypoint rewrites index.html and writes the proxy snippet
            # at start-up, so the root filesystem stays writable.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
