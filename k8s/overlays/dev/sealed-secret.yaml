# sealed-secret.yaml — Example SealedSecret for dev environment.
#
# SealedSecrets are encrypted at rest using the Bitnami Sealed Secrets
# controller's public key. Only the controller running inside the cluster
# can decrypt this — safe to commit to Git.
#
# To generate your own:
#   kubectl create secret generic app-secrets \
#     --from-literal=api-key=my-dev-api-key \
#     --dry-run=client -o yaml | \
#   kubeseal --controller-namespace kube-system \
#            --controller-name sealed-secrets-controller \
#            --format yaml > sealed-secret.yaml
#
# The controller decrypts it and creates a normal Kubernetes Secret that
# pods can reference as env vars or volume mounts.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: gitops-dev
  labels:
    app.kubernetes.io/managed-by: sealed-secrets
    environment: dev
spec:
  encryptedData:
    # PLACEHOLDER — replace with real encrypted values from kubeseal
    api-key: AgBt...PLACEHOLDER...==
  template:
    metadata:
      name: app-secrets
      namespace: gitops-dev
    type: Opaque
