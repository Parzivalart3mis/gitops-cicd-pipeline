# patches/env-config.yaml — Staging environment config.
#
# git_sha and frontend_version are rewritten by scripts/set-image-tag.sh
# (promote/rollback workflows) together with the image tags.

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  environment: "staging"
  log_level: "info"
  git_sha: "unknown"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  frontend_version: "unknown"
