# security/opa-gatekeeper/templates/block-latest-tag.yaml — ConstraintTemplate (the Rego policy).
# Its Constraint (where the policy applies) is in ../constraints/block-latest-tag.yaml. Templates
# are applied first: Gatekeeper creates a CRD per template, and a Constraint
# can only be created once that CRD exists (scripts/setup-cluster.sh waits).
# OPA Gatekeeper constraint: block deployments using the :latest image tag.
#
# Why: The :latest tag is mutable — it can point to different images at
# different times. Using :latest in production means you cannot be certain
# which code is running, making rollbacks and audits unreliable.
#
# This constraint is applied only to staging and prod namespaces.
# Dev is allowed to use :latest for fast iteration.

apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sblocklatestimage
  labels:
    team: platform
    app.kubernetes.io/component: opa-policy
spec:
  crd:
    spec:
      names:
        kind: K8sBlockLatestImage
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblocklatestimage

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf(
            "Container '%v' uses the ':latest' image tag which is not allowed in this environment. Use an explicit tag (e.g., a git SHA).",
            [container.name]
          )
        }

        # Last path segment of the reference, e.g. "gitops-backend:abc1234"
        # from "ghcr.io/owner/gitops-backend:abc1234". Looking only at this
        # segment stops a registry port ("registry:5000/app") from passing
        # as a tag.
        image_name(image) = name {
          parts := split(image, "/")
          name := parts[count(parts) - 1]
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not contains(container.image, "@")   # digest-pinned images are fine
          not contains(image_name(container.image), ":")
          msg := sprintf(
            "Container '%v' does not specify an image tag. Use an explicit tag (e.g., :a1b2c3d).",
            [container.name]
          )
        }
