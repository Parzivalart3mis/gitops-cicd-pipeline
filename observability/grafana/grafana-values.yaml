# observability/grafana/grafana-values.yaml
# Helm values for Grafana.
#
# Chart: grafana-community/grafana (version pinned in scripts/versions.env as
# GRAFANA_CHART_VERSION). The grafana/grafana chart is deprecated; the chart
# now lives in grafana-community/helm-charts.
#
# Install: scripts/install-observability.sh, which first creates the
# `grafana-dashboards` ConfigMap from observability/grafana/dashboards/*.json.
# That ConfigMap must exist before Grafana starts: the chart mounts it as a
# required volume, and without it the pod never leaves ContainerCreating.

adminPassword: "gitops-demo-admin"  # local demo only — use a SealedSecret + admin.existingSecret for anything real

service:
  type: NodePort
  nodePort: 30300

# Datasources. The uids are fixed because dashboards reference datasources by
# uid; without them Grafana generates random uids and every dashboard panel
# reports "datasource not found".
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        access: proxy
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy

# Load dashboards from the ConfigMap created by install-observability.sh.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: "GitOps Demo"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboardsConfigMaps:
  default: grafana-dashboards

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

plugins: []

grafana.ini:
  # Allow anonymous read-only access for demo purposes
  auth.anonymous:
    enabled: true
    org_role: Viewer
  server:
    root_url: "http://localhost:30300"
