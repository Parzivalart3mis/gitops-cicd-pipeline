# observability/loki/loki-values.yaml — Loki log store (single-binary, local storage).
#
# Chart: grafana-community/loki (version pinned in scripts/versions.env as
# LOKI_CHART_VERSION). The OSS Loki chart moved from grafana/helm-charts to
# grafana-community/helm-charts in March 2026.
#
# Monolithic mode runs all Loki components in one pod: right-sized for a
# Kind cluster (small volume, no HA). Logs are written to a PVC on the
# default local-path StorageClass and kept for 3 days.
#
# Logs are shipped by Grafana Alloy (alloy-values.yaml) and queried from
# Grafana via the "Loki" datasource (grafana-values.yaml), e.g.:
#   {namespace="gitops-prod", app="backend"} | json | level="error"
#
# Install: scripts/install-observability.sh.

deploymentMode: Monolithic

loki:
  auth_enabled: false            # single tenant; no X-Scope-OrgID needed
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scalable-mode targets: unused in Monolithic mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Not needed for a single-tenant local install: Alloy and Grafana talk to the
# Loki service directly, and memcached caches would only add pods.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
