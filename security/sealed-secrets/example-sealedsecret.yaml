# example-sealedsecret.yaml — What a SealedSecret looks like (reference only).
#
# This file is NOT deployed and its ciphertext is a placeholder. Real
# SealedSecrets are encrypted with the public key of the controller running
# in YOUR cluster, and every fresh Kind cluster generates a new key pair, so a
# committed ciphertext only decrypts in the cluster that sealed it.
#
# To create a real one (cluster must be running):
#
#   make seal-secret ENV=dev NAME=app-secrets DATA="api-key=my-dev-api-key"
#
# which runs scripts/seal-secret.sh to:
#   1. build the Secret client-side (kubectl create secret --dry-run=client),
#   2. encrypt it with kubeseal against the in-cluster controller
#      (kube-system/sealed-secrets-controller),
#   3. write k8s/overlays/dev/app-secrets.sealedsecret.yaml, and
#   4. add that file to the overlay's kustomization resources.
#
# Commit the result; ArgoCD applies it and the controller decrypts it into a
# normal Secret that pods can reference via env vars or volume mounts.
#
# Note: the controller key is lost when the Kind cluster is deleted. After
# `make teardown && make setup`, re-run `make seal-secret` for each secret.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: gitops-dev
  labels:
    app.kubernetes.io/managed-by: sealed-secrets
    environment: dev
spec:
  encryptedData:
    # PLACEHOLDER — real values come from kubeseal
    api-key: AgBt...PLACEHOLDER...==
  template:
    metadata:
      name: app-secrets
      namespace: gitops-dev
    type: Opaque
