# backend/deployment.yaml — Kubernetes Deployment for the FastAPI backend.
#
# Key production-readiness features included here:
#   - Non-root security context (runAsNonRoot: true)
#   - Liveness, readiness, AND startup probes (prevents traffic to unhealthy pods)
#   - Zero-downtime rolling update (maxUnavailable: 0)
#   - revisionHistoryLimit: 5 (enables kubectl rollout undo)
#   - Resource requests AND limits on every container
#   - Prometheus scrape annotations
#
# The image reference here is a placeholder: each overlay's images[] entry
# (name: ghcr.io/parzivalart3mis/gitops-backend) sets the real tag, and that
# name must match this one exactly, lowercase included, or Kustomize leaves
# the placeholder in place. Registry paths must be lowercase anyway.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 1  # initial value — overlays set it; the HPA owns it afterwards
  revisionHistoryLimit: 5  # keep 5 old ReplicaSets so kubectl rollout undo works
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # create 1 new pod before killing old ones
      maxUnavailable: 0  # never kill a pod unless a replacement is healthy
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
      annotations:
        # Prometheus will scrape pods with these annotations automatically
        # when using the default scrape config shipped with kube-prometheus-stack.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: backend
      # Pod-level security context — applies to all containers
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread pods across nodes for HA — best-effort (ScheduleAnyway), so a
      # small cluster never blocks scheduling or a rolling update.
      #   nodeTaintsPolicy: Honor — skip nodes the pod can't run on (e.g. the
      #     tainted Kind control-plane). The default (Ignore) counts them as
      #     empty domains, which skews the calculation.
      #   matchLabelKeys: pod-template-hash — compute skew per ReplicaSet so
      #     old and new pods don't distort each other during a rollout.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: backend
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: backend
          # Placeholder — the overlay's images[] entry sets the real tag.
          image: ghcr.io/parzivalart3mis/gitops-backend:latest
          # Tags are immutable git SHAs, so a cached image is always correct.
          # IfNotPresent also lets `make demo` / `make load-images` use images
          # side-loaded with `kind load` instead of pulling from GHCR.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: environment
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: log_level
            - name: GIT_SHA
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: git_sha
          # Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Startup probe: gives the app up to 60 s to pass its first health check.
          # Only after the startup probe succeeds do liveness/readiness kick in.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12  # 12 × 5s = 60s max startup time
            timeoutSeconds: 3
          # Liveness probe: restart the container if it becomes unresponsive.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe: remove pod from Service endpoints if not ready.
          # /readyz returns 503 until the FastAPI lifespan startup completes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # tmpdir needed because readOnlyRootFilesystem=true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
