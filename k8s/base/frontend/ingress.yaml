# frontend/ingress.yaml — Ingress rule for the frontend.
#
# The host is a placeholder: every overlay patches spec.rules[0].host
# (<env>.gitops.local) so the environments don't collide.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: gitops.local  # replaced by each overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
