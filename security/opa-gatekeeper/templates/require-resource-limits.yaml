# security/opa-gatekeeper/templates/require-resource-limits.yaml — ConstraintTemplate (the Rego policy).
# Its Constraint (where the policy applies) is in ../constraints/require-resource-limits.yaml. Templates
# are applied first: Gatekeeper creates a CRD per template, and a Constraint
# can only be created once that CRD exists (scripts/setup-cluster.sh waits).
# OPA Gatekeeper constraint: all containers must specify CPU and memory limits.
#
# Why: Containers without resource limits can consume unlimited CPU and memory,
# causing CPU throttling and OOMKills for neighbouring pods (the "noisy neighbour"
# problem). Resource limits enable the HPA to scale correctly and protect cluster stability.

apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresourcelimits
  labels:
    team: platform
    app.kubernetes.io/component: opa-policy
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResourceLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresourcelimits

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.resources.limits.cpu
          msg := sprintf(
            "Container '%v' does not specify a CPU limit. All containers must have resource limits.",
            [container.name]
          )
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.resources.limits.memory
          msg := sprintf(
            "Container '%v' does not specify a memory limit. All containers must have resource limits.",
            [container.name]
          )
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.resources.requests.cpu
          msg := sprintf(
            "Container '%v' does not specify a CPU request. All containers must have resource requests.",
            [container.name]
          )
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          not container.resources.requests.memory
          msg := sprintf(
            "Container '%v' does not specify a memory request. All containers must have resource requests.",
            [container.name]
          )
        }
