# nginx.conf — Nginx configuration for the GitOps demo frontend.
#
# Design goals:
#   - Serve static files efficiently with correct caching headers.
#   - Add security response headers (CSP, X-Frame-Options, etc.) to EVERY
#     response.
#   - Enable gzip compression to reduce transfer size.
#   - Expose /healthz so Kubernetes probes don't hit the app backend.
#   - Reverse-proxy /backend/ to the backend Service (see entrypoint.sh), so
#     the browser talks to the API same-origin, whatever URL it used to reach
#     the frontend (Ingress host or kubectl port-forward).
#
# IMPORTANT: add_header directives are inherited from the http level only by
# locations that define NO add_header of their own. Locations below therefore
# set caching with `expires` and the JSON type with `default_type`, never with
# add_header. Adding one to a location silently drops every security header
# for it; CI's frontend smoke test checks for exactly that.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;   # non-root: /tmp is writable

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log format (easy to parse with Loki)
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;
    server_tokens     off;

    # ---------------------------------------------------------------------------
    # Gzip compression — reduces payload for text assets
    # ---------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # Security response headers (inherited by every location; see note above)
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # connect-src allows any origin so the image can also run outside Kubernetes
    # with BACKEND_URL pointing at a separately published backend port.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https:; frame-ancestors 'none'"
        always;

    # ---------------------------------------------------------------------------
    # Main server block
    # ---------------------------------------------------------------------------
    server {
        listen      8080;        # non-root: cannot bind to port 80
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Kubernetes liveness/readiness probe — answered by Nginx itself.
        location = /healthz {
            access_log   off;
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        # Backend reverse proxy. entrypoint.sh writes this snippet at container
        # start when BACKEND_UPSTREAM is set (it is, in Kubernetes). The glob
        # include matches nothing otherwise, which nginx accepts.
        include /etc/nginx/snippets/*.conf;

        # Static assets. The demo ships no hashed bundles, so cache briefly
        # rather than marking assets immutable.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires    7d;
            access_log off;
        }

        # index.html — always revalidate so browsers pick up new deployments.
        location / {
            try_files $uri $uri/ /index.html;
            expires   -1;
        }
    }
}
