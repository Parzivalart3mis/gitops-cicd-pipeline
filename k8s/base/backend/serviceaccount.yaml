# backend/serviceaccount.yaml — Dedicated ServiceAccount for the backend.
#
# Using a dedicated ServiceAccount (instead of the default one) allows us
# to apply RBAC policies that limit what the backend pod can do within
# the cluster. The automountServiceAccountToken: false setting disables
# the default token mount because the backend doesn't call the Kubernetes API.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: false
