# security/trivy/trivy-config.yaml — Trivy configuration for local scans.
#
# Used by `make scan`:
#   trivy fs    --config security/trivy/trivy-config.yaml .
#   trivy image --config security/trivy/trivy-config.yaml <image>
#
# CI (.github/workflows/ci.yml) passes the same settings as trivy-action
# inputs, so local and CI results match: CRITICAL/HIGH findings that have a
# fix available fail the scan.

severity:
  - CRITICAL
  - HIGH

exit-code: 1
format: table

scan:
  scanners:
    - vuln     # OS packages and language dependencies (pip, npm, …)
    - secret   # credentials accidentally committed to the source tree
  skip-dirs:
    - .git
    - node_modules
    - "**/__pycache__"
    - "**/.venv"

vulnerability:
  ignore-unfixed: true   # nothing actionable until upstream ships a fix

cache:
  dir: .cache/trivy

db:
  skip-update: false
