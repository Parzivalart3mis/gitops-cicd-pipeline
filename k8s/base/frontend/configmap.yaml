# frontend/configmap.yaml — Runtime configuration injected into the frontend container.
#
#   backend_url      — base URL the browser's JavaScript calls. "/backend" is
#                      same-origin: the frontend's Nginx proxies it onward.
#                      (A cluster-internal URL such as backend.<ns>.svc… can
#                      never work here: the browser runs outside the cluster.)
#   backend_upstream — where that Nginx proxy forwards /backend/* to: the
#                      backend Service in the same namespace.
#   frontend_version — shown in the UI; set to the image tag by
#                      scripts/set-image-tag.sh (CI, promote, rollback).

apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: config
data:
  backend_url: "/backend"
  backend_upstream: "http://backend:8000"
  frontend_version: "unknown"  # overridden per overlay by set-image-tag.sh
