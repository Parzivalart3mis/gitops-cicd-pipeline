# security/sealed-secrets/controller-values.yaml
# Helm values for the Bitnami Sealed Secrets controller.
#
# Chart: sealed-secrets from https://bitnami.github.io/sealed-secrets (the old
# bitnami-labs.github.io URL now returns 404). Version pinned in
# scripts/versions.env as SEALED_SECRETS_CHART_VERSION.
#
# Install: scripts/setup-cluster.sh. Create secrets with `make seal-secret`.
#
# How Sealed Secrets works:
#   1. You create a regular Kubernetes Secret locally.
#   2. You encrypt it with `kubeseal` using the controller's public key.
#   3. The resulting SealedSecret (encrypted YAML) is safe to commit to Git.
#   4. The controller running in the cluster decrypts it and creates the real Secret.
#   5. The real Secret is never stored in Git — only the SealedSecret is.
#
# This is simpler than HashiCorp Vault for a portfolio demo while demonstrating
# the correct principle: never commit plaintext secrets to Git.

# kubeseal looks for a controller named sealed-secrets-controller in
# kube-system by default; naming it that way keeps kubeseal flag-free.
fullnameOverride: sealed-secrets-controller

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Automatically renew the encryption key pair every 30 days
keyrenewperiod: "720h"  # 30 days

# Label to identify SealedSecret objects managed by this controller
additionalNamespaces: []  # controller manages secrets in all namespaces by default

metrics:
  # Expose Prometheus metrics on /metrics
  serviceMonitor:
    enabled: false  # enable if you have the Prometheus operator installed
