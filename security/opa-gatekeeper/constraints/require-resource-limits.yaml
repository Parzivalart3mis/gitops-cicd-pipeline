# security/opa-gatekeeper/constraints/require-resource-limits.yaml — Constraint (where the policy applies).
# The Rego policy itself is the ConstraintTemplate in ../templates/require-resource-limits.yaml.

apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResourceLimits
metadata:
  name: require-resource-limits
  labels:
    team: platform
    app.kubernetes.io/component: opa-policy
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces:
      - gitops-dev
      - gitops-staging
      - gitops-prod
