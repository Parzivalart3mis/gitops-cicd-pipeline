# k8s/base/kustomization.yaml — Root Kustomize base configuration.
#
# Contains all resources shared across environments. Environment-specific
# overrides (replica counts, HPA ranges, resource limits, quotas, ingress
# hosts, image tags) live in overlays/.
#
# Why Kustomize instead of Helm?
#   - No templating language to learn; pure YAML with strategic merge patches.
#   - kubectl kustomize is built-in since kubectl v1.14 — zero extra tooling.
#   - Overlays compose cleanly with Git diffs; Helm values are opaque.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - backend/serviceaccount.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/configmap.yaml
  - backend/hpa.yaml
  - backend/ingress.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/configmap.yaml
  - frontend/hpa.yaml
  - frontend/ingress.yaml
  - common/network-policy.yaml
  - common/resource-quota.yaml
  - common/pod-disruption-budget.yaml

# Labels applied to every resource's metadata and to pod templates.
# includeSelectors is false on purpose: selectors are immutable on
# Deployments, so they stay minimal (app: <name>) and adding or renaming a
# label later never forces a Deployment to be recreated. (The deprecated
# commonLabels field always wrote labels into selectors.)
labels:
  - pairs:
      app.kubernetes.io/part-of: gitops-demo
      app.kubernetes.io/managed-by: kustomize
      team: platform
    includeSelectors: false
    includeTemplates: true
