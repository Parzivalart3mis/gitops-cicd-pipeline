<!DOCTYPE html>
<!--
  index.html — GitOps Demo Frontend

  A deliberately minimal single-page app that calls the backend API and
  displays the current deployment version. The version banner is the key
  visual proof in demos that a new Docker image was deployed successfully.

  __BACKEND_URL__ is replaced at container start-time by the entrypoint
  script (entrypoint.sh) so the same image works across all environments.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitOps CI/CD Demo</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2d3148;
      --accent: #6c63ff;
      --accent-dim: #4e47cc;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #e2e8f0;
      --muted: #64748b;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 { font-size: 1.25rem; font-weight: 700; }
    header .tag {
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    /* ---- Version banner ---- */
    .version-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .version-card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; }
    .version-row { display: flex; gap: 2rem; flex-wrap: wrap; }
    .kv { display: flex; flex-direction: column; gap: 2px; }
    .kv span:first-child { font-size: 0.72rem; color: var(--muted); }
    .kv code { font-family: var(--mono); font-size: 0.9rem; color: var(--accent); }

    /* ---- Health indicator ---- */
    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .health-pill.healthy { background: rgba(34,197,94,0.1); border-color: var(--green); color: var(--green); }
    .health-pill.unhealthy { background: rgba(239,68,68,0.1); border-color: var(--red); color: var(--red); }
    .health-pill.checking { background: rgba(245,158,11,0.1); border-color: var(--yellow); color: var(--yellow); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    /* ---- Items panel ---- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .panel-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h3 { font-size: 0.95rem; font-weight: 600; }

    form.add-form {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .add-form input {
      flex: 1;
      min-width: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .add-form input:focus { border-color: var(--accent); }
    .add-form input[type="number"] { max-width: 80px; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-dim); }
    .btn.danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
    .btn.danger:hover { background: rgba(239,68,68,0.1); }

    #items-list { list-style: none; }
    #items-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    #items-list li:last-child { border-bottom: none; }
    .item-info strong { font-size: 0.95rem; }
    .item-info span { font-size: 0.78rem; color: var(--muted); display: block; }
    .item-qty {
      font-family: var(--mono);
      font-size: 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      margin-right: 0.75rem;
    }
    .empty-state {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <h1>GitOps CI/CD Demo</h1>
  <span class="tag">Portfolio Project</span>
  <span id="health-indicator" class="health-pill checking">
    <span class="dot"></span> Checking…
  </span>
</header>

<main>
  <!-- Version banner — key demo artifact -->
  <div class="version-card">
    <h2>Deployment Info</h2>
    <div class="version-row">
      <div class="kv">
        <span>Git SHA</span>
        <code id="git-sha">—</code>
      </div>
      <div class="kv">
        <span>Environment</span>
        <code id="environment">—</code>
      </div>
      <div class="kv">
        <span>Frontend Build</span>
        <code>__FRONTEND_VERSION__</code>
      </div>
      <div class="kv">
        <span>Backend URL</span>
        <code id="backend-url-display">—</code>
      </div>
    </div>
  </div>

  <!-- Items CRUD panel -->
  <div class="panel">
    <div class="panel-header">
      <h3>Items</h3>
      <button class="btn" onclick="loadItems()">↻ Refresh</button>
    </div>

    <form class="add-form" onsubmit="addItem(event)">
      <input id="item-name"  type="text"   placeholder="Item name"        required />
      <input id="item-desc"  type="text"   placeholder="Description (optional)" />
      <input id="item-qty"   type="number" placeholder="Qty" value="1" min="0" />
      <button class="btn" type="submit">+ Add Item</button>
    </form>

    <ul id="items-list">
      <li><div class="empty-state">Loading items…</div></li>
    </ul>
  </div>
</main>

<footer>
  <a href="https://github.com/Parzivalart3mis/gitops-cicd-pipeline" target="_blank">
    github.com/Parzivalart3mis/gitops-cicd-pipeline
  </a>
  &nbsp;·&nbsp; Built with GitHub Actions · ArgoCD · Kubernetes
</footer>

<script>
  // BACKEND_URL is replaced by the Nginx entrypoint at container start.
  const BACKEND_URL = '__BACKEND_URL__';

  document.getElementById('backend-url-display').textContent = BACKEND_URL;

  async function checkHealth() {
    const el = document.getElementById('health-indicator');
    try {
      const res = await fetch(`${BACKEND_URL}/healthz`);
      const data = await res.json();
      document.getElementById('git-sha').textContent      = data.version     || '—';
      document.getElementById('environment').textContent  = data.environment || '—';
      el.className = 'health-pill healthy';
      el.innerHTML = '<span class="dot"></span> Backend Healthy';
    } catch (e) {
      el.className = 'health-pill unhealthy';
      el.innerHTML = '<span class="dot"></span> Backend Unreachable';
    }
  }

  async function loadItems() {
    const list = document.getElementById('items-list');
    try {
      const res = await fetch(`${BACKEND_URL}/api/v1/items`);
      const items = await res.json();
      if (items.length === 0) {
        list.innerHTML = '<li><div class="empty-state">No items yet — add one above.</div></li>';
        return;
      }
      list.innerHTML = items.map(item => `
        <li>
          <div class="item-info">
            <strong>${escHtml(item.name)}</strong>
            <span>${escHtml(item.description || '')} &nbsp;·&nbsp; <em>${new Date(item.created_at).toLocaleString()}</em></span>
          </div>
          <div style="display:flex;align-items:center">
            <span class="item-qty">×${item.quantity}</span>
            <button class="btn danger" onclick="deleteItem('${item.id}')">Delete</button>
          </div>
        </li>
      `).join('');
    } catch (e) {
      list.innerHTML = '<li><div class="empty-state" style="color:#ef4444">Failed to load items — is the backend reachable?</div></li>';
    }
  }

  async function addItem(e) {
    e.preventDefault();
    const name = document.getElementById('item-name').value.trim();
    const desc = document.getElementById('item-desc').value.trim();
    const qty  = parseInt(document.getElementById('item-qty').value, 10);
    try {
      await fetch(`${BACKEND_URL}/api/v1/items`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description: desc, quantity: qty }),
      });
      document.getElementById('item-name').value = '';
      document.getElementById('item-desc').value = '';
      document.getElementById('item-qty').value  = '1';
      await loadItems();
    } catch (e) {
      alert('Failed to create item. Is the backend reachable?');
    }
  }

  async function deleteItem(id) {
    await fetch(`${BACKEND_URL}/api/v1/items/${id}`, { method: 'DELETE' });
    await loadItems();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Initial load
  checkHealth();
  loadItems();
  // Poll health every 30 s
  setInterval(checkHealth, 30_000);
</script>
</body>
</html>
