# backend/ingress.yaml — Ingress rule for the backend API.
#
# Exposes the API on its own host for direct access (curl, Swagger UI). The
# browser UI does not need it: the frontend proxies /backend/* in-cluster.
#
# Paths are passed through to FastAPI unchanged. There is deliberately no
# nginx.ingress.kubernetes.io/rewrite-target: without capture groups it
# rewrites EVERY request path to "/", so /api/v1/items and /healthz would all
# hit the root route and 404.
#
# /metrics is not exposed: Prometheus scrapes it in-cluster via the
# ServiceMonitor, and the NetworkPolicy only admits the monitoring namespace.
#
# The host is a placeholder: every overlay patches spec.rules[0].host
# (api.<env>.gitops.local) so the three environments never claim the same
# host, which ingress-nginx's admission webhook rejects.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: api.gitops.local  # replaced by each overlay
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
          # FastAPI's interactive docs and the schema they load.
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
