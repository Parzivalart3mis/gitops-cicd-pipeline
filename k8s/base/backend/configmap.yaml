# backend/configmap.yaml — Application configuration for the backend.
#
# Environment-specific values (environment name, log level, git SHA) are
# patched by each overlay's patches/env-config.yaml. Using a ConfigMap instead
# of raw env vars gives a single source of truth visible in kubectl describe.
#
# git_sha: each overlay's env-config patch carries its own git_sha, which
# scripts/set-image-tag.sh rewrites together with the image tag (CI for dev,
# promote/rollback workflows for the rest), so /healthz reports the commit
# that is actually running. The value here is only the fallback.

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: config
data:
  environment: "base"       # overridden by overlay patch
  log_level: "info"         # overridden by overlay patch
  git_sha: "unknown"        # overridden by overlay patch
