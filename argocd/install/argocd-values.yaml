# argocd/install/argocd-values.yaml — Helm values for the Argo CD chart.
#
# Chart: argo/argo-cd, version pinned in scripts/versions.env
# (ARGOCD_CHART_VERSION). Re-check these keys whenever that pin changes:
# chart 5.x moved server.config → configs.cm and server.insecure →
# configs.params, and the old keys are silently ignored.
#
# Install: scripts/install-argocd.sh (called by `make setup`).

global:
  additionalLabels:
    team: platform
    app.kubernetes.io/part-of: gitops-demo

configs:
  # argocd-cm
  cm:
    # External URL of the UI (Kind maps NodePort 30080 to the host).
    url: http://localhost:30080
    # No repositories entry: the repo is public, so Argo CD needs no
    # credentials for it.

  # argocd-cmd-params-cm
  params:
    # Serve plain HTTP: local demo with no TLS-terminating proxy in front.
    # Without this, http://localhost:30080 just redirects to HTTPS.
    server.insecure: true

server:
  service:
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

controller:
  # Exposes argocd_app_info, used by the ArgoCDAppOutOfSync alert.
  # install-argocd.sh enables the ServiceMonitor when the Prometheus
  # Operator CRDs are present (they are after install-observability.sh).
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

notifications:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
