# nginx.conf — Nginx configuration for the GitOps demo frontend.
#
# Design goals:
#   - Serve static files efficiently with correct caching headers.
#   - Add security response headers (CSP, HSTS, X-Frame-Options, etc.).
#   - Enable gzip compression to reduce transfer size.
#   - Expose /healthz so Kubernetes probes don't hit the app backend.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;   # non-root: /tmp is writable

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log format (easy to parse with Loki / Fluentd)
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Gzip compression — reduces payload for text assets
    # ---------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # Security response headers
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;"
        always;

    # ---------------------------------------------------------------------------
    # Main server block
    # ---------------------------------------------------------------------------
    server {
        listen      8080;        # non-root: cannot bind to port 80
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Kubernetes liveness probe — served by Nginx itself, no backend needed
        location /healthz {
            access_log off;
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }

        # Static assets — aggressive caching (content-hashed filenames assumed)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
        }

        # index.html — no caching so browsers always pick up new deployments
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
