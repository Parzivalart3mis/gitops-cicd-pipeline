# patches/env-config.yaml — Production environment config.
# Warn-level logging reduces log volume and cost in production.

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  environment: "prod"
  log_level: "warning"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  backend_url: "http://backend.gitops-prod.svc.cluster.local:8000"
