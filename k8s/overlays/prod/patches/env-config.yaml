# patches/env-config.yaml — Production environment config.
# Warn-level logging reduces log volume and cost in production.
#
# git_sha and frontend_version are rewritten by scripts/set-image-tag.sh
# (promote/rollback workflows) together with the image tags.

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  environment: "prod"
  log_level: "warning"
  git_sha: "unknown"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  frontend_version: "unknown"
