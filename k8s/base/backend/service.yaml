# backend/service.yaml — ClusterIP Service for the backend.
#
# ClusterIP is used (not NodePort/LoadBalancer) because external traffic
# is routed through the Ingress controller. Direct pod-to-pod traffic
# within the cluster uses this ClusterIP DNS name:
#   http://backend.<namespace>.svc.cluster.local:8000

apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
