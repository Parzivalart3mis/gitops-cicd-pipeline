# security/opa-gatekeeper/constraints/block-latest-tag.yaml — Constraint (where the policy applies).
# The Rego policy itself is the ConstraintTemplate in ../templates/block-latest-tag.yaml.

apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sBlockLatestImage
metadata:
  name: block-latest-tag-staging-prod
  labels:
    team: platform
    app.kubernetes.io/component: opa-policy
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    # Only enforce in staging and prod (dev can use :latest)
    namespaces:
      - gitops-staging
      - gitops-prod
