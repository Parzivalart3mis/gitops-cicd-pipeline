# .github/workflows/ci.yml — Main CI pipeline.
#
# Triggered on:
#   - Push to main or develop (runs full pipeline including build+push)
#   - Pull requests against main or develop (runs lint/test/scan only)
#
# Job dependency chain:
#   lint-and-test → security-scan → build-and-push → update-manifests
#
# The final update-manifests job writes the new image tag back to the
# k8s/overlays/dev/kustomization.yaml and pushes a commit. That commit
# is what ArgoCD detects to trigger a deployment — the GitOps loop.

name: CI Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel in-progress runs for the same branch/PR to avoid wasted compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gitops-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/gitops-frontend
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint and Test
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
      fail-fast: false  # test both apps even if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/frontend/**'
            k8s:
              - 'k8s/**'

      # ---- Backend: Python ----
      - name: Set up Python
        if: matrix.app == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        if: matrix.app == 'backend'
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Lint backend (ruff)
        if: matrix.app == 'backend'
        working-directory: apps/backend
        run: |
          pip install ruff mypy
          ruff check src/
          mypy src/ --ignore-missing-imports

      - name: Run backend tests with coverage
        if: matrix.app == 'backend'
        working-directory: apps/backend
        run: |
          pytest src/tests/ -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80
        env:
          ENVIRONMENT: test
          GIT_SHA: ${{ github.sha }}

      - name: Upload backend coverage report
        if: matrix.app == 'backend' && always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          retention-days: 7

      # ---- Frontend: Nginx config lint ----
      - name: Lint Nginx config
        if: matrix.app == 'frontend'
        run: |
          docker run --rm \
            -v "$PWD/apps/frontend/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27.0-alpine \
            nginx -t -c /etc/nginx/nginx.conf 2>&1 || true

      # ---- Kubernetes manifest validation (runs once, not per matrix) ----
      - name: Validate Kustomize builds
        if: matrix.app == 'backend'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          for env in dev staging prod; do
            echo "=== Validating overlay: $env ==="
            kustomize build k8s/overlays/$env > /dev/null
            echo "✅ $env overlay is valid"
          done

      - name: Lint shell scripts (shellcheck)
        if: matrix.app == 'backend'
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  # ---------------------------------------------------------------------------
  # Job 2: Security Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      security-events: write  # required to upload SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (source code)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"  # don't fail the build on source scan; we scan images too
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Scan Python dependencies for known vulnerabilities
        working-directory: apps/backend
        run: |
          pip install safety
          safety check -r requirements.txt --full-report || true
          # Non-blocking: report findings but don't fail the pipeline.
          # Adjust to exit-code 1 when you want hard failures.

      - name: Run kubesec scan on Kubernetes manifests
        run: |
          curl -sSL https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz | \
            tar xz && sudo mv kubesec /usr/local/bin/

          echo "=== Scanning backend deployment ==="
          kubesec scan k8s/base/backend/deployment.yaml | \
            python3 -c "
          import sys, json
          results = json.load(sys.stdin)
          for r in results:
              score = r.get('score', 0)
              print(f'Score: {score}')
              if score < 0:
                  print('FAIL: kubesec score is negative')
                  sys.exit(1)
          print('PASS: kubesec score is acceptable')
          "

          echo "=== Scanning frontend deployment ==="
          kubesec scan k8s/base/frontend/deployment.yaml | \
            python3 -c "
          import sys, json
          results = json.load(sys.stdin)
          for r in results:
              score = r.get('score', 0)
              print(f'Score: {score}')
          "

      - name: Upload security scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: trivy-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: Build and Push Docker Images
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: security-scan
    # Only build on pushes (not PRs) to avoid publishing untested PR code
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write  # required to push to GHCR

    strategy:
      matrix:
        app: [backend, frontend]

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitops-${{ matrix.app }}
          tags: |
            # Git SHA short tag — this is the primary immutable tag used in manifests
            type=sha,prefix=,format=short
            # Branch name tag — useful for quick "what's on main?" lookups
            type=ref,event=branch
            # Latest tag — convenient but never used in staging/prod manifests
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=gitops-${{ matrix.app }}
            org.opencontainers.image.description=GitOps CI/CD demo ${{ matrix.app }}
            org.opencontainers.image.vendor=GitOps Demo

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile.multistage
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            FRONTEND_VERSION=${{ github.sha }}
          # Use GitHub Actions cache for Docker layers to speed up builds
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Scan built image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitops-${{ matrix.app }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL
          exit-code: "1"  # fail on CRITICAL vulnerabilities in the final image

  # ---------------------------------------------------------------------------
  # Job 4: Update Kubernetes Manifests (the GitOps commit)
  # ---------------------------------------------------------------------------
  update-manifests:
    name: Update Dev Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write  # required to push the manifest update commit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update image tags in dev overlay
        run: |
          cd k8s/overlays/dev
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/gitops-backend=ghcr.io/${{ github.repository_owner }}/gitops-backend:${{ steps.sha.outputs.short }}
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/gitops-frontend=ghcr.io/${{ github.repository_owner }}/gitops-frontend:${{ steps.sha.outputs.short }}

      - name: Also update GIT_SHA in the app ConfigMap
        run: |
          # Patch the git_sha key in the dev env-config patch so /healthz
          # returns the exact commit SHA for verification during demos.
          sed -i "s/git_sha: .*/git_sha: \"${{ steps.sha.outputs.short }}\"/" \
            k8s/overlays/dev/patches/env-config.yaml

      - name: Commit and push manifest changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/

          # Only commit if there are actual changes (idempotent)
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore(deploy): update dev images to ${{ steps.sha.outputs.short }}

          - Backend:  ghcr.io/${{ github.repository_owner }}/gitops-backend:${{ steps.sha.outputs.short }}
          - Frontend: ghcr.io/${{ github.repository_owner }}/gitops-frontend:${{ steps.sha.outputs.short }}

          Triggered by: ${{ github.actor }} @ ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi
