# .github/workflows/promote.yml — Environment promotion workflow.
#
# Moves a tested Docker image from one environment to the next in the
# promotion chain: dev → staging → prod.
#
# This workflow is triggered manually via workflow_dispatch so a human
# must consciously decide to promote. The validate job blocks invalid
# promotion paths (e.g. dev → prod directly).
#
# After promotion, the updated overlay is committed to Git. ArgoCD
# (if auto-sync is enabled for the target) or a human sync completes
# the deployment.

name: Promote Environment

on:
  workflow_dispatch:
    inputs:
      source_env:
        description: "Source environment (where the image is currently deployed)"
        required: true
        type: choice
        options:
          - dev
          - staging
      target_env:
        description: "Target environment (where to promote to)"
        required: true
        type: choice
        options:
          - staging
          - prod
      image_tag:
        description: "Image tag (git SHA) to promote — e.g. a1b2c3d"
        required: true
        type: string
      reason:
        description: "Reason for promotion (for audit trail)"
        required: false
        type: string
        default: "Routine promotion"

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Validate promotion path
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Promotion Path
    runs-on: ubuntu-latest

    steps:
      - name: Check promotion path is valid
        run: |
          SOURCE="${{ inputs.source_env }}"
          TARGET="${{ inputs.target_env }}"

          echo "Promotion: $SOURCE → $TARGET"
          echo "Image tag: ${{ inputs.image_tag }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Triggered by: ${{ github.actor }}"

          # Enforce valid promotion paths
          if [[ "$SOURCE" == "dev" && "$TARGET" == "staging" ]]; then
            echo "✅ Valid promotion path: dev → staging"
          elif [[ "$SOURCE" == "staging" && "$TARGET" == "prod" ]]; then
            echo "✅ Valid promotion path: staging → prod"
          elif [[ "$SOURCE" == "dev" && "$TARGET" == "prod" ]]; then
            echo "❌ ERROR: Cannot promote dev → prod directly. Must go through staging."
            exit 1
          elif [[ "$SOURCE" == "$TARGET" ]]; then
            echo "❌ ERROR: Source and target environment cannot be the same."
            exit 1
          else
            echo "❌ ERROR: Unknown promotion path: $SOURCE → $TARGET"
            exit 1
          fi

      - name: Verify image exists in registry
        run: |
          # Check that the image tag actually exists before promoting
          # Uses the GitHub Container Registry API
          TAG="${{ inputs.image_tag }}"
          OWNER="${{ github.repository_owner }}"

          echo "Verifying ghcr.io/${OWNER}/gitops-backend:${TAG} exists..."
          # In a real setup: use crane digest or skopeo inspect
          # Here we use docker manifest inspect as a proxy check
          docker manifest inspect "ghcr.io/${OWNER}/gitops-backend:${TAG}" 2>/dev/null && \
            echo "✅ Backend image exists" || \
            echo "⚠️  Could not verify image (may be private — proceeding)"

  # ---------------------------------------------------------------------------
  # Perform promotion
  # ---------------------------------------------------------------------------
  promote:
    name: Promote ${{ inputs.source_env }} → ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update target environment manifests
        run: |
          TARGET="${{ inputs.target_env }}"
          TAG="${{ inputs.image_tag }}"
          OWNER="${{ github.repository_owner }}"

          cd k8s/overlays/${TARGET}

          kustomize edit set image \
            ghcr.io/${OWNER}/gitops-backend=ghcr.io/${OWNER}/gitops-backend:${TAG}
          kustomize edit set image \
            ghcr.io/${OWNER}/gitops-frontend=ghcr.io/${OWNER}/gitops-frontend:${TAG}

          echo "Updated $TARGET overlay to use image tag: $TAG"

      - name: Update GIT_SHA in target env config patch
        run: |
          TARGET="${{ inputs.target_env }}"
          TAG="${{ inputs.image_tag }}"
          sed -i "s/git_sha: .*/git_sha: \"${TAG}\"/" \
            k8s/overlays/${TARGET}/patches/env-config.yaml

      - name: Commit and push promotion
        run: |
          SOURCE="${{ inputs.source_env }}"
          TARGET="${{ inputs.target_env }}"
          TAG="${{ inputs.image_tag }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${TARGET}/

          git commit -m "chore(promote): ${SOURCE} → ${TARGET} [${TAG}]

          Promoted by: ${{ github.actor }}
          Reason: ${{ inputs.reason }}
          Source: ${SOURCE} environment
          Target: ${TARGET} environment
          Image tag: ${TAG}

          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push

      - name: Print next steps
        run: |
          TARGET="${{ inputs.target_env }}"
          echo ""
          echo "============================================================"
          echo "✅ Promotion complete!"
          echo "============================================================"
          echo ""
          echo "The ${TARGET} overlay has been updated with image tag: ${{ inputs.image_tag }}"
          echo ""
          if [[ "$TARGET" == "staging" ]]; then
            echo "ArgoCD for staging is set to MANUAL sync."
            echo "To complete the deployment, run:"
            echo "  argocd app sync gitops-demo-staging"
            echo "  OR use the ArgoCD UI at http://localhost:30080"
          elif [[ "$TARGET" == "prod" ]]; then
            echo "ArgoCD for prod is set to MANUAL sync."
            echo "Verify staging is healthy before syncing prod:"
            echo "  argocd app get gitops-demo-staging"
            echo "  argocd app sync gitops-demo-prod"
          fi
